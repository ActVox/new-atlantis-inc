# pnpm 11 reads settings from this file; the "pnpm" field in package.json is ignored.

# Packages allowed to run install scripts (pnpm 11 blocks all others by default):
# - sharp: Next.js's image optimizer, builds a native binary
# - unrs-resolver: native module resolver used by eslint-config-next
allowBuilds:
  sharp: true
  unrs-resolver: true

# Carried over from the (now ignored) "pnpm.overrides" field in package.json.
overrides:
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
